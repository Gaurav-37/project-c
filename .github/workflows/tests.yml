# Runs the combat test suite on GitHub every time you push.
#
# WHY THIS EXISTS: there is no reviewer on this project, so the test suite is
# the only thing standing between a mistake and master. This makes the suite
# run on a clean machine that has none of your local state — no .godot import
# cache, no editor open, nothing left over from a previous session. A test
# that passes on your PC and fails here means the repository is missing
# something that only exists on your disk.
#
# WHERE TO SEE IT: the "Actions" tab on github.com/Gaurav-37/project-c, and a
# green tick or red X next to each commit in the commit list.
#
# NOTHING TO INSTALL. GitHub runs this; your machine is not involved.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button, for running it by hand

env:
  # Keep this in step with the Godot version you have locally.
  GODOT_VERSION: 4.7.1

jobs:
  combat-tests:
    name: Combat test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        # NOTE: if binary assets (models, audio) ever start arriving through
        # Git LFS and the tests come to depend on them, add `with: lfs: true`.
        # Left off for now so the run does not spend LFS bandwidth it has no
        # use for.

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          BUILD="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${BUILD}.zip"
          unzip -q godot.zip
          sudo install -m 755 "$BUILD" /usr/local/bin/godot
          godot --version

      - name: Import the project
        # A fresh clone has no .godot/ cache, so the first open builds one.
        #
        # This MUST be --editor. Godot only registers class_name types
        # (AttackData, PlayerCombat, TargetDummy...) during an editor scan.
        # In plain run mode on a fresh checkout those names do not exist yet,
        # so every script mentioning one fails to parse — and Godot still
        # exits 0. That is a green tick over a suite that never ran.
        run: godot --headless --path . --editor --quit

      - name: Run the combat test suite
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee result.txt

          # run_tests.gd exits 1 on a failed assertion, which fails the job on
          # its own. These two checks cover the nastier case: a suite that
          # never ran at all, which exits 0 and looks identical to success.
          if grep -q 'SCRIPT ERROR' result.txt; then
            echo "::error::Godot reported a script error — see the log above"
            exit 1
          fi

          total=$(grep -oE '^[0-9]+ passed' result.txt | grep -oE '[0-9]+' || true)
          if [ -z "$total" ] || [ "$total" -lt 1 ]; then
            echo "::error::no assertions ran — the suite did not report a result"
            exit 1
          fi
          echo "$total assertions ran"
